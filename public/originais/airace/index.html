<style>
/* No backdrop blur on the big always-on panels: each one re-blurs the live canvas every frame, and at
   Retina density the eleven of them cost more than the race itself (60 fps without them, ~25 with). */
:root{
  --sky-top:#16243C; --sky-mid:#5C86B4; --sky-low:#B6CBDD;
  --sun:#FFD36E; --road:#241A3A;
  --ink:#1A1130; --paper:#FFF6E9; --paper-dim:#E8D5C4;
  --lift:0 6px 20px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.3);
  --lift-sm:0 3px 10px rgba(0,0,0,.34);
  --display:"Fredoka",system-ui,sans-serif;
  --ui:"Outfit",system-ui,-apple-system,sans-serif;
}
/* Chinese and Japanese use the fonts already on the device (a CJK web font is megabytes); Latin
   letters and digits keep Fredoka and Outfit. Japanese leans rounded where Hiragino Maru is there. */
:root:lang(zh-Hans){
  --display:"Fredoka","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
  --ui:"Outfit","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
}
:root:lang(ja){
  --display:"Fredoka","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  --ui:"Outfit","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:#16243C; color:var(--paper);
  font-family:var(--ui); overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:var(--sun); color:var(--ink)}
:focus-visible{outline:3px solid var(--sun); outline-offset:3px; border-radius:8px}

#stage{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:pan-y; background:#93cafa}
/* the world and the headline come up first; the panels fade in when the field lands */
#board, #dock, #rail{transition:opacity .5s ease}
body.booting #board, body.booting #dock, body.booting #rail{opacity:0; pointer-events:none}
#boom{position:fixed; inset:auto 0 50% 0; text-align:center; color:var(--paper); font:600 1rem var(--ui)}

/* Legibility scrim: the headline sits over a live 3D scene whose brightness the
   copy cannot predict, so it carries its own ground instead of relying on shadow. */
/* The dock sits over grass now, so it carries its own ground for contrast. */
#dockscrim{position:fixed; inset:auto 0 0 0; height:min(34vh,270px); pointer-events:none; z-index:0;
  background:linear-gradient(to top, rgba(12,20,32,.92) 0%, rgba(12,20,32,.72) 38%,
    rgba(12,20,32,.32) 68%, rgba(12,20,32,0) 100%)}
#vig{position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(120% 92% at 50% 46%, rgba(14,22,36,0) 55%, rgba(14,22,36,.16) 100%)}
/* The gradient must reach zero inside its own box, or the box edge clips it and
   leaves a hard rectangle across the sky. */
#scrim{position:fixed; inset:0 auto auto 0; width:min(58rem,72vw); height:min(62vh,580px);
  background:radial-gradient(ellipse 100% 100% at 0% 0%,
    rgba(10,16,28,.62) 0%, rgba(10,16,28,.60) 10%, rgba(10,16,28,.54) 20%, rgba(10,16,28,.46) 30%,
    rgba(10,16,28,.37) 40%, rgba(10,16,28,.27) 50%, rgba(10,16,28,.18) 60%, rgba(10,16,28,.11) 70%,
    rgba(10,16,28,.06) 80%, rgba(10,16,28,.02) 90%, rgba(10,16,28,0) 97%);
  pointer-events:none; z-index:0}
@media (max-width:860px){#scrim{width:100vw; height:min(46vh,380px)}}

/* ---------- overlay ---------- */
#ui{position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column;
    padding:clamp(14px,2.4vw,28px); gap:12px; overflow:hidden}
#ui > *{pointer-events:auto}

header{max-width:min(40rem,46vw); flex:0 0 auto}
/* the site's name over the headline: a checkered flag, AIRACE leaning into the corner, and .lol
   on a sticker in the style of the leader's shout */
.brandrow{display:flex; align-items:center; gap:12px; margin:0 0 .5em}
.brand{display:inline-flex; align-items:center; gap:6px; margin:0; color:var(--paper); text-decoration:none;
  font:700 clamp(1rem,1.45vw,1.2rem)/1 var(--display); letter-spacing:.02em;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}
.brand svg{width:1.25em; height:1.25em; overflow:visible; transform-origin:18% 90%;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.br-word{display:inline-block; transform:skewX(-9deg); background:linear-gradient(180deg,#fff 30%,var(--sun) 130%);
  -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 1px 2px rgba(0,0,0,.55)); text-shadow:none}
.br-lol{display:inline-block; margin-left:1px; padding:.16em .38em .2em; border-radius:.5em; rotate:-6deg;
  background:var(--sun); color:#1A1130; font-size:.8em; letter-spacing:.01em; text-shadow:none;
  border:2px solid #1A1130; box-shadow:0 2.5px 0 #1A1130; transition:rotate .25s cubic-bezier(.2,1.7,.4,1), translate .25s cubic-bezier(.2,1.7,.4,1)}
.brand:hover .br-lol, .brand:focus-visible .br-lol{rotate:4deg; translate:0 -2px}
.brand:hover svg, .brand:focus-visible svg{animation:flagwave .7s ease-in-out 2}
@keyframes flagwave{0%,100%{rotate:0deg} 30%{rotate:-10deg} 70%{rotate:7deg}}
@media (prefers-reduced-motion:reduce){ .brand:hover svg, .brand:focus-visible svg{animation:none} .br-lol{transition:none} }
/* language switcher: a quiet pill beside the name, opening a small menu */
.langbtn{display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px 0 6px; border-radius:999px; cursor:pointer;
  border:1px solid rgba(255,246,233,.22); background:rgba(20,14,38,0.47); color:var(--paper); font:600 .7rem/1 var(--ui); opacity:.82; transition:opacity .15s ease, background .15s ease}
.langbtn:hover, .langbtn[aria-expanded="true"]{opacity:1; background:rgba(36,26,58,.78)}
.langbtn svg{width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round}
h1{
  font-family:var(--display); font-weight:700;
  /* tie the display size to height as well as width: a tall narrow pane must not
     hand six lines of headline to a race that needs the middle of the screen */
  font-size:clamp(1.5rem,min(3.6vw,5vh),3.1rem); line-height:1.04; padding-bottom:.05em; letter-spacing:-.04em;
  margin:0; color:var(--paper);
  text-shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.45);
  text-wrap:balance;
}
#callout{
  margin:.5em 0 0; font-size:clamp(.84rem,2.2vw,1.12rem); font-weight:500;
  line-height:1.4; color:var(--paper); max-width:34ch;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden;
  text-shadow:0 1px 3px rgba(0,0,0,.72), 0 6px 18px rgba(0,0,0,.6);
}
#callout b{font-weight:700; color:var(--sun)}

/* "according to [source ▾]" — only shown for races with more than one source */
#according{display:flex; align-items:center; gap:.5em; flex-wrap:wrap; margin:.45em 0 0;
  font-size:clamp(.82rem,1.6vw,1rem); font-weight:500; color:var(--paper);
  text-shadow:0 1px 3px rgba(0,0,0,.72)}
#according[hidden]{display:none}
#according .sel{position:relative; display:inline-flex}
#according .sel::after{content:""; position:absolute; right:.8em; top:50%; width:.42em; height:.42em;
  border:solid currentColor; border-width:0 2px 2px 0; transform:translateY(-70%) rotate(45deg);
  pointer-events:none; color:var(--sun)}
#source{appearance:none; -webkit-appearance:none; font:inherit; font-weight:700; color:var(--sun);
  background:rgba(20,14,38,0.72); border:1px solid rgba(255,211,110,.45); border-radius:999px;
  padding:.28em 2.1em .32em .8em; cursor:pointer; max-width:min(19rem,70vw);
  text-overflow:ellipsis; box-shadow:0 2px 10px rgba(0,0,0,.25)}
#source:hover{background:rgba(36,26,58,.82); border-color:var(--sun)}
#source option{color:#231A08; background:#FFF6E9; font-weight:600}

/* ---------- leaderboard ---------- */
#board{
  width:290px; margin-top:16px; min-height:0; flex:0 1 auto; overflow:auto;
  scrollbar-width:thin; scrollbar-color:rgba(255,246,233,.3) transparent; background:rgba(36,26,58,0.92); border:1px solid rgba(255,246,233,.16); border-radius:18px;
  padding:14px 8px 10px; box-shadow:var(--lift);
}
#board h2{
  font-family:var(--display); font-weight:600; font-size:.8rem; letter-spacing:.01em;
  margin:0 0 9px 7px; position:sticky; top:0; color:var(--paper-dim); text-transform:none;
  display:flex; align-items:center; justify-content:space-between; padding-right:7px;
}
#toggle{display:none; border:1px solid rgba(255,246,233,.24); background:transparent;
  color:var(--paper); font-family:var(--display); font-weight:600; font-size:.72rem;
  border-radius:999px; padding:4px 11px; cursor:pointer}
#toggle:hover{background:rgba(255,246,233,.12)}
.row{
  position:relative; isolation:isolate; overflow:hidden;
  display:grid; grid-template-columns:1.35rem 1fr auto; align-items:center; gap:9px;
  padding:6px 9px; border-radius:10px; cursor:pointer; border:0; width:100%;
  background:transparent; color:var(--paper); font-family:var(--ui); font-size:.9rem;
  text-align:left; transition:transform .18s cubic-bezier(.2,.9,.25,1);
}
/* how far down the track this lab actually is */
.row::before{
  content:''; position:absolute; inset:0 auto 0 0; z-index:-1;
  width:100%; transform:scaleX(var(--t,0)); transform-origin:left center;
  background:currentColor; opacity:.16; border-radius:10px;
  transition:transform .7s cubic-bezier(.2,.9,.25,1);
}
.row::after{
  content:''; position:absolute; inset:0; z-index:-2; border-radius:10px;
  background:rgba(255,246,233,.045);
}
.row:hover,.row:focus-visible{transform:translateX(3px)}
.row:hover::after{background:rgba(255,246,233,.1)}
.row .nm > span{color:var(--paper)}
.row .pos{font-weight:700; color:var(--paper-dim); font-variant-numeric:tabular-nums; font-size:.8rem}
.row .nm{font-weight:600; display:flex; align-items:center; gap:7px; min-width:0}
.row .nm span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mk{width:17px; height:17px; flex:none; display:block; border-radius:3px; object-fit:contain}
.flag{width:16px; height:12px; flex:none; border-radius:2px; display:block;
  box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#card h3 .flag{width:21px; height:16px; border-radius:3px}
.mono{border-radius:50%; display:grid; place-items:center; font-family:var(--display);
  font-weight:700; font-size:.56rem; color:#1A1130; font-style:normal; letter-spacing:0}
#card h3 .mk{width:21px; height:21px}
.row .val{font-variant-numeric:tabular-nums; font-weight:600; color:var(--sun); font-size:.85rem}
.row.lead .pos{color:var(--sun)}
.row.lead .nm{font-weight:700}
.row.lead::after{background:rgba(255,211,110,.1)}
.crown{width:13px; height:13px; flex:none; fill:var(--sun); margin-left:1px}
#more{margin:10px 8px 2px; padding-top:9px; border-top:1px solid rgba(255,246,233,.1);
  font-size:.74rem; color:var(--paper-dim); line-height:1.45}

/* ---------- chips ---------- */
#dock{margin-top:auto; display:flex; flex-direction:column; gap:12px}
#chips{display:flex; gap:9px; overflow-x:auto; padding:4px 2px 6px;
       scrollbar-width:thin; scrollbar-color:rgba(255,246,233,.35) transparent}
#chips::-webkit-scrollbar{height:6px}
#chips::-webkit-scrollbar-thumb{background:rgba(255,246,233,.35); border-radius:99px}
.chip{
  flex:none; border:1px solid rgba(255,246,233,.18);
  background:linear-gradient(rgba(46,32,74,.88), rgba(30,20,54,.88));
  color:var(--paper); border-radius:999px;
  padding:9px 17px; font-family:var(--display); font-weight:600; font-size:.95rem;
  cursor:pointer; white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,246,233,.13), var(--lift-sm);
  transition:transform .18s cubic-bezier(.2,.9,.25,1), background .18s ease, color .18s ease;
}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{
  background:linear-gradient(#FFE9A8,#FFC94D); color:#231A08; border-color:#FFF0BC;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 0 0 3px rgba(255,201,77,.28), var(--lift-sm);
  transform:translateY(-1px)}
.chip[aria-pressed="true"]:hover{transform:translateY(-3px)}
#hint{margin:0 2px; font-size:.72rem; color:var(--paper-dim); opacity:.75}
#foot{display:flex; align-items:center; gap:14px; flex-wrap:wrap;
      font-size:.76rem; color:var(--paper-dim); line-height:1.5}
#foot a{color:var(--paper-dim); text-underline-offset:3px}
#foot a:hover{color:var(--sun)}
#replay{
  border:1px solid rgba(255,246,233,.24); background:rgba(36,26,58,.8); color:var(--paper);
  font-family:var(--display); font-weight:600; font-size:.85rem; border-radius:999px;
  padding:7px 15px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  box-shadow:var(--lift-sm); transition:transform .18s ease;
}
#replay:hover{transform:translateY(-2px)}

/* ---------- model card ---------- */
#card{
  position:fixed; left:50%; bottom:120px; transform:translate(-50%,14px);
  width:min(370px,90vw); overflow:hidden;
  background:linear-gradient(rgba(46,32,74,.96), rgba(26,17,48,.96));
  border:1px solid rgba(255,246,233,.18); border-radius:22px; padding:0;
  box-shadow:inset 0 1px 0 rgba(255,246,233,.16), var(--lift); opacity:0; visibility:hidden;
  transition:opacity .22s ease, transform .22s cubic-bezier(.2,.9,.25,1), visibility .22s;
}
#card.on{opacity:1; visibility:visible; transform:translate(-50%,0)}
#cardHead{padding:16px 19px 13px; background:var(--wash,transparent);
  border-bottom:1px solid rgba(255,246,233,.12)}
#card h3{font-family:var(--display); font-weight:700; font-size:1.26rem; margin:0 0 3px;
         display:flex; align-items:center; gap:10px; letter-spacing:-.025em}
#card .sub{color:var(--paper-dim); font-size:.83rem; margin:0; line-height:1.4}
#card dl{display:grid; grid-template-columns:auto 1fr; gap:9px 16px; margin:0;
  font-size:.87rem; padding:15px 19px 17px}
#card dt{color:var(--paper-dim)}
#card dd{margin:0; font-weight:600; font-variant-numeric:tabular-nums; text-align:right}
#close{position:absolute; top:13px; right:13px; z-index:2; width:29px; height:29px; border-radius:50%;
       border:1px solid rgba(255,246,233,.2); background:transparent; color:var(--paper);
       cursor:pointer; display:grid; place-items:center}
#close:hover{background:rgba(255,246,233,.14)}

/* CJK headlines: no negative tracking, a little more leading, and Japanese breaks between phrases */
:lang(zh-Hans) h1, :lang(ja) h1{letter-spacing:0; line-height:1.16}
:lang(ja) h1, :lang(ja) #callout, :lang(ja) .cm-text{word-break:auto-phrase}

@media (max-width:860px){
  /* the race owns the middle of the screen; panels hug the edges */
  /* room for a three-line callout, so the header's height (and the camera fit that
     reads it) does not change when a race with a longer sentence is selected */
  header{min-height:6.4rem}
  #board{width:auto; order:2; margin-top:auto; max-height:46vh; padding:9px 6px 6px;
         background:rgba(26,17,48,.72)}
  #toggle{display:inline-block}
  #board.min .row:nth-child(n+2){display:none}
  #board.min #more{display:none}
  #board h2{margin-bottom:6px}
  #dock{order:3; margin-top:0}
  header{max-width:none}
  h1{font-size:clamp(1.25rem,min(5.9vw,3.8vh),2rem); line-height:1.06}
  #callout{font-size:.88rem; max-width:none; -webkit-line-clamp:3}
  #ui{gap:8px}
  #more{font-size:.78rem}
  .row{font-size:1rem; padding:8px 10px; grid-template-columns:1.6rem 1fr auto}
  .row .pos{font-size:.92rem}
  .row .val{font-size:.95rem}
  .mk{width:21px; height:21px}
  .flag{width:20px; height:15px}
  #board h2{font-size:.92rem}
  #toggle{font-size:.82rem; padding:6px 13px}
  .chip{font-size:1.02rem; padding:11px 19px}
  #foot{font-size:.72rem; gap:9px}
  #card dl{font-size:.95rem}
  #card h3{font-size:1.35rem}
  #card{bottom:auto; top:50%; transform:translate(-50%,calc(-50% + 14px))}
  #card.on{transform:translate(-50%,-50%)}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
}

/* ---------- name labels over the cars (positioned by scene.js) ---------- */
#ui{z-index:2}
#card{z-index:8}
#labels{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden}
.car-label{position:absolute; left:0; top:0; display:none; align-items:center; gap:6px;
  padding:3px 10px 3px 3px; border:1.5px solid rgba(255,255,255,.93); border-radius:20px;
  background:var(--car-color); color:#fff; font-family:var(--display); font-weight:700; font-size:13px;
  line-height:1; white-space:nowrap; pointer-events:auto; cursor:pointer; will-change:transform;
  box-shadow:0 2px 7px rgba(21,40,61,.22); text-shadow:0 1px 2px rgba(0,0,0,.14);
  transition:opacity .3s ease, padding .45s cubic-bezier(.2,.8,.2,1), gap .45s cubic-bezier(.2,.8,.2,1)}
.car-label .label-name{display:inline-block; max-width:16em; overflow:hidden; transition:max-width .45s cubic-bezier(.2,.8,.2,1), opacity .3s ease}
.car-label .badge{width:20px; height:20px; border-radius:50%; background:#fff; display:grid; place-items:center; overflow:hidden; flex:none}
.car-label .badge .mk{width:14px; height:14px; margin:0}
.car-label .badge .mono{font-size:8px; width:20px; height:20px; display:grid; place-items:center; color:#fff; font-style:normal}
.car-label .crown{position:absolute; top:-20px; left:50%; width:22px; height:18px; transform:translateX(-50%);
  fill:#FFB32F; stroke:#fff; stroke-width:1.2; display:none; overflow:visible}
.car-label.first{font-size:15px; padding:4px 12px 4px 4px;
  box-shadow:0 0 0 3px rgba(255,201,77,.6), 0 3px 12px rgba(21,40,61,.32)}
.car-label.first .badge{width:23px; height:23px}
.car-label.first .crown{display:block}
.car-label.missing{opacity:.45}
/* all but the top three fold down to a faded logo badge once a race change settles; hovering one,
   or its standings row, opens the name again */
.car-label.compact{padding:2px; gap:0; opacity:.62}
.car-label.compact.missing{opacity:.38}
.car-label.compact .label-name{max-width:0; opacity:0}
.car-label.compact:hover, .car-label.compact.hl{opacity:1; padding:3px 10px 3px 3px; gap:6px}
.car-label.compact:hover .label-name, .car-label.compact.hl .label-name{max-width:16em; opacity:1}
/* while the field speeds to a new order, the new podium stands out: a pulsing ring in gold, silver and
   bronze, and a place number on second and third (absolutely placed, so the label keeps its size) */
.car-label[data-podium="1"]{--podium:#FFC94D; --podium-glow:rgba(255,201,77,.55)}
.car-label[data-podium="2"]{--podium:#E4E9F0; --podium-glow:rgba(228,233,240,.5)}
.car-label[data-podium="3"]{--podium:#E7A66A; --podium-glow:rgba(231,166,106,.55)}
.car-label.hot{box-shadow:0 0 0 3px var(--podium), 0 0 18px 4px var(--podium-glow), 0 3px 12px rgba(21,40,61,.32);
  animation:podium-pulse .8s ease-in-out infinite alternate}
.car-label.hot[data-podium="2"]::before, .car-label.hot[data-podium="3"]::before{content:attr(data-podium); position:absolute;
  left:-8px; top:-9px; width:18px; height:18px; border-radius:50%; display:grid; place-items:center; background:var(--podium);
  color:#231A08; font:700 11px/1 var(--display); box-shadow:0 1px 4px rgba(0,0,0,.35)}
@keyframes podium-pulse{from{filter:brightness(1)} to{filter:brightness(1.14)}}
@media (prefers-reduced-motion:reduce){ .car-label.hot{animation:none} }
.car-label:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
@media (max-width:860px){
  .car-label{font-size:10px; padding:2px 6px 2px 2px; gap:3px}
  .car-label .badge{width:15px; height:15px}
  .car-label .badge .mk{width:11px; height:11px}
  .car-label .label-name{max-width:80px; overflow:hidden; text-overflow:ellipsis}
  .car-label.first{font-size:12px; padding:3px 8px 3px 3px}
  .car-label.first .badge{width:18px; height:18px}
}

/* lighter overlays over the bright world; the dock carries its own panel instead */
#dockscrim{height:min(26vh,220px);
  background:linear-gradient(to top, rgba(12,20,32,.62) 0%, rgba(12,20,32,.38) 38%, rgba(12,20,32,.12) 68%, rgba(12,20,32,0) 100%)}
#srcToggle{display:none; font:inherit; font-weight:600; font-size:.8rem; color:var(--paper);
  background:rgba(36,26,58,.72); border:1px solid rgba(255,246,233,.22); border-radius:999px; padding:6px 13px; cursor:pointer}
@media (max-width:860px){
  #hint{display:none}
  #foot{flex-wrap:wrap}
  #srcToggle{display:inline-flex}
  #src{display:none}
  #foot.open #src{display:block; flex-basis:100%}
}

/* chip with an attached "according to" chevron */
.chipwrap{display:inline-flex; flex:none; align-items:stretch}
.chipwrap .chip{border-top-right-radius:0; border-bottom-right-radius:0; padding-right:12px}
.chev{flex:none; display:grid; place-items:center; width:34px; margin-left:-1px; cursor:pointer;
  border:1px solid rgba(255,246,233,.18); border-left-color:rgba(255,246,233,.1); border-radius:0 999px 999px 0;
  background:linear-gradient(rgba(46,32,74,.88), rgba(30,20,54,.88)); color:var(--paper);
  box-shadow:inset 0 1px 0 rgba(255,246,233,.13), var(--lift-sm); transition:transform .18s ease}
.chev svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.chev:hover{transform:translateY(-2px)}
.chev[aria-expanded="true"] svg{transform:rotate(180deg)}
.chipwrap.on .chev{background:linear-gradient(#FFE9A8,#FFC94D); color:#231A08; border-color:#FFF0BC; transform:translateY(-1px)}
#srcmenu, #langmenu{position:fixed; z-index:9; min-width:230px; padding:6px; border-radius:14px;
  background:rgba(26,17,48,.95); backdrop-filter:blur(14px); border:1px solid rgba(255,246,233,.18); box-shadow:var(--lift)}
#srcmenu .srchead{margin:4px 10px 6px; font-size:.72rem; color:var(--paper-dim); text-transform:uppercase; letter-spacing:.08em}
#srcmenu .srchint{margin:6px 10px 2px; font-size:.7rem; color:var(--paper-dim); opacity:.8}
#srcmenu .opt, #langmenu .opt{display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--paper);
  font:600 .9rem var(--ui); padding:8px 10px; border-radius:9px; cursor:pointer}
#srcmenu .opt:hover, #srcmenu .opt:focus-visible, #langmenu .opt:hover, #langmenu .opt:focus-visible{background:rgba(255,246,233,.1)}
#srcmenu .opt[aria-selected="true"]{color:var(--sun)}
#srcmenu .opt[aria-selected="true"]::after{content:" \2713"}
#langmenu{min-width:160px}
#langmenu .opt[aria-checked="true"]{color:var(--sun)}
#langmenu .opt[aria-checked="true"]::after{content:" \2713"}

/* circuit picker, top right */

.autoplay{flex:none; position:sticky; left:0; z-index:2; width:40px; height:40px; padding:0; border-radius:50%;
